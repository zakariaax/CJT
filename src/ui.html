<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#fafafa;--card:#fff;--line:#eaeaea;--line2:#f2f2f2;--tx:#1f2328;--mut:#6e7781;--acc:#111;--blue:#1a56db;--orange:#c2410c;--red:#b91c1c}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;font-size:14px}

.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
header{display:flex;align-items:baseline;gap:12px;padding:22px 0 6px;flex-wrap:wrap}h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}.sub{font-size:12.5px;color:var(--mut)}.upd{margin-left:auto;font-size:12px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:10px 0 4px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left;transition:border-color .15s,box-shadow .15s}.st:hover{border-color:#cfd4da;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.st b{display:block;font-size:22px;font-weight:650;letter-spacing:-.02em}.st span{font-size:12px;color:var(--mut)}.st.warn b{color:var(--orange)}.st.ok b{color:#15803d}.st.rdy b{color:var(--blue)}
.tabs{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;padding:11px 16px;font-size:15px;color:#57606a;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}.tab.on{color:var(--acc);border-color:var(--acc);font-weight:650}.tab i{font-style:normal;font-size:12px;background:#f0f0f0;border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--mut)}
.bar{display:flex;gap:8px;padding:12px 0;flex-wrap:wrap;align-items:center}
.bar input,.bar select{border:1px solid #e1e4e8;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:#fff;color:var(--tx);height:36px}
.bar input[type=search]{flex:1;min-width:220px;max-width:360px}.bar .cnt{margin-left:auto;font-size:12.5px;color:var(--mut)}
.reset{border:0;background:none;color:var(--blue);font-size:13px;padding:0 4px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:28px}

th{text-align:left;font-weight:500;color:var(--mut);padding:9px 12px;border-bottom:1px solid var(--line);background:#fcfcfc;white-space:nowrap;font-size:12.5px}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr.job{cursor:pointer;transition:background .1s}tbody tr.job:hover{background:#f7f9fc}tbody tr.job.soon{background:#fff8f3}tbody tr.job.soon:hover{background:#fff1e6}
tr.grp td{background:#f6f7f8;font-size:12px;font-weight:600;color:#57606a;padding:8px 12px;letter-spacing:.02em}
.t{font-weight:600;font-size:13.5px}.c{color:var(--mut);font-size:12px;margin-top:2px}
.jb{color:var(--blue);text-decoration:none;font-size:12px;margin-left:4px}
.p{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:550;white-space:nowrap}
.s-sent{background:#dcfce7;color:#166534}.s-draft_saved{background:#e8f0fe;color:#1a56db}.s-no_email{background:#fef3c7;color:#92400e}.s-skipped{background:#f1f1f1;color:#6b7280}
.fl{display:flex;gap:4px;flex-wrap:wrap}.b{font-size:11px;padding:2px 7px;border-radius:6px;background:#f3f4f6;color:#4b5563;white-space:nowrap}.b.lm{background:#ede9fe;color:#5b21b6}.b.in{background:#e0f2fe;color:#075985}.b.fm{background:#fce7f3;color:#9d174d}
.cl{white-space:nowrap}td.c-found{white-space:nowrap}.cl.soon{color:var(--orange);font-weight:600}.cl.urgent{color:var(--red);font-weight:700}.cl.past{color:#9ca3af;text-decoration:line-through}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;height:100%;width:min(760px,100%);background:#f6f7f9;z-index:21;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}.dr.on{transform:none}
.dh{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px 14px;position:relative}
.dh h2{margin:0 40px 2px 0;font-size:20px;letter-spacing:-.01em}.dh .co{color:var(--mut);font-size:14px}.dh .co a{color:var(--blue);text-decoration:none;white-space:nowrap}
.x{position:absolute;top:14px;right:14px;border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1;color:#444}
.big{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600}
.big::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.db{overflow-y:auto;padding:16px 22px 40px;flex:1;-webkit-overflow-scrolling:touch}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.f{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.4;word-break:break-word}.f .lb{display:block;color:#9ca3af;font-size:11px;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em;font-style:normal}.f.w2{grid-column:span 2}.f.w4{grid-column:1/-1}
.sec{margin-top:16px}.sec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#4338ca;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.meta{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;font-size:13px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #f0f0f0;white-space:normal}.meta b{color:#9ca3af;font-weight:500}
.cp{border:1px solid #e5e7eb;background:#fff;border-radius:7px;font-size:12px;padding:4px 10px;color:#374151;text-transform:none;letter-spacing:0;font-weight:500}.cp.done{background:#dcfce7;border-color:#bbf7d0;color:#166534}
.att{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-bottom:8px}.att .ic{width:34px;height:40px;border-radius:6px;background:#fee2e2;color:#b91c1c;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.att .nm{flex:1;min-width:0}.att .nm b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.att .nm small{color:var(--mut)}
.btn{border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;text-decoration:none;color:#111;white-space:nowrap}.btn.pri{background:#111;color:#fff;border-color:#111}
.na{color:#9ca3af;font-style:italic}
details.more{margin-top:16px}details.more summary{cursor:pointer;font-size:13px;color:#4b5563;font-weight:600}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.f.w2{grid-column:1/-1}}
@media (max-width:760px){
 .wrap{padding:0 14px}header{padding-top:16px}.upd{margin-left:0;width:100%}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .st:first-child{grid-column:1/-1}.st b{font-size:20px}
 .tab{flex:0 0 auto;font-size:15px;padding:12px 10px}.bar input[type=search]{max-width:none;min-width:100%}.bar select{flex:1;min-width:calc(50% - 4px)}.bar .cnt{width:100%;margin-left:0}
 .tbl{background:none;border:0}table,tbody{display:block}thead{display:none}
 tr.grp{display:block}tr.grp td{display:block;background:none;padding:14px 2px 6px}
 tr.job{display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}tbody tr.job.soon{background:#fff;border-left:3px solid var(--orange)}
 tr.job td{display:block;padding:0;border:0}
 td.c-job{grid-column:1/2}td.c-st{grid-column:2/3;grid-row:1;text-align:right}td.c-loc,td.c-pay,td.c-type{grid-column:1/-1;font-size:12.5px;color:#4b5563}td.c-loc .c{display:inline;margin-left:4px}
 td.c-fl{grid-column:1/-1}td.c-found,td.c-cl{font-size:12px;color:var(--mut)}td.c-found::before{content:"Found "}td.c-cl{text-align:right}td.c-cl::before{content:"Closes ";color:var(--mut);font-weight:400}
 .tab{flex:0 0 auto;padding:12px 10px}
 .dr{width:100%;box-shadow:none}.dh{padding:16px 16px 12px}.db{padding:14px 16px 40px}.big{font-size:13px}
 .savebar{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none !important}
.fixture{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:10px;padding:8px 12px;font-size:12.5px;margin:8px 0 0;line-height:1.45}
.install{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0 2px;font-size:12.5px;color:#4b5563;line-height:1.45}
.install p{margin:0}
.install button{margin-top:8px;min-height:44px;background:#111;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:650}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:#4b5563;min-height:36px}
.opt input{width:18px;height:18px;accent-color:#111}
.intro{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;line-height:1.5}
.intro h2{margin:0 0 6px;font-size:16px}
.intro p,.intro li{margin:6px 0;color:#4b5563}
.roles{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.role{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.role-top{display:flex;gap:12px;align-items:flex-start;min-height:44px;cursor:pointer}
.role-top input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:#111}
.role h3{margin:0;font-size:16px;letter-spacing:-.01em}
.role .subline{display:block;margin-top:3px;color:var(--mut);font-size:12.5px}
.noc-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:650;color:var(--tx)}
.role ul{margin:6px 0 0;padding-left:18px}
.role h4{margin:12px 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#4338ca}
.warnbox{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 12px;color:#9a3412;font-size:13px;line-height:1.45;margin-top:10px}
.course{border-top:1px solid var(--line2);margin-top:10px;padding-top:8px}
.course a{color:var(--blue)}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;margin-right:6px}
.pill.reg{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.pill.fit-current{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.pill.fit-portfolio{background:#e8f0fe;color:#1a56db;border-color:#c7d7fd}
.pill.fit-conditional{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
.pill.fit-earlier{background:#f3f4f6;color:#4b5563;border-color:#e5e7eb}
.ifilters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.ifilters label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}
.ifilters input[type=search]{width:100%;max-width:480px;height:44px;border:1px solid #e1e4e8;border-radius:8px;padding:8px 10px;font:inherit}
.tiers{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tiers button{min-height:44px;border:1px solid #e1e4e8;background:#fff;border-radius:999px;padding:8px 12px;font-size:13px}
.tiers button.on{background:#111;color:#fff;border-color:#111}
.shown{margin:8px 0 0;color:var(--mut);font-size:12.5px}
.savebar{position:sticky;bottom:0;z-index:5;background:#fafafa;border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(250,250,250,.95);padding:12px 0 16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.save-copy{flex:1;min-width:220px}
.save-copy p{margin:0 0 4px}
.savebar button{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:650;min-height:44px}
.savebar button:disabled{opacity:.5}
.okmsg{color:#15803d;font-weight:650}
.errmsg{color:var(--red);font-weight:650}
</style></head><body>
<div class="wrap">
<header><h1>🍁 Canada Job Tracker</h1><span class="sub">__DISPLAY_NAME__ · Job Bank applications</span><button type="button" class="reset" id="logoutBtn">Log out</button><span class="upd" id="upd"></span></header>
<p id="fixtureBanner" class="fixture" hidden></p>
<section id="install" class="install" aria-label="Install the tracker"><p id="installMsg"></p><div id="installAction"></div></section>
<div class="stats" id="stats"></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
<div id="jobView">
<div class="bar" id="bar">
 <input type="search" id="q" placeholder="Search title, company, city, email…" autocomplete="off">
 <select id="fDate" title="Date found"></select>
 <select id="fStatus"><option value="">All statuses</option><option value="sent">Sent</option><option value="draft_saved">Draft ready</option><option value="no_email">No email</option><option value="skipped">Skipped</option><option value="soon">Closing soon</option></select>
 <select id="fProv"><option value="">All provinces</option></select>
 <select id="fNoc"><option value="">All NOC</option></select>
 <select id="fLmia"><option value="">LMIA: any</option><option value="req">LMIA requested</option><option value="none">No LMIA shown</option></select>
 <select id="fSort"><option value="found">Newest found</option><option value="close">Closing soonest</option><option value="sent">Recently sent</option><option value="pay">Highest pay</option></select>
 <label class="opt" for="onlyInterests"><input type="checkbox" id="onlyInterests"> Optional: limit this list to saved job interests</label>
 <button class="reset" id="reset">Reset</button><span class="cnt" id="cnt"></span>
</div>
<div class="tbl"><table><thead><tr><th>Job</th><th>Location</th><th>Type</th><th>Pay</th><th>Flags</th><th>Found</th><th>Closes</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table><div class="empty" id="empty" hidden></div></div>
</div>
<section id="interestView" hidden aria-label="Job interests"><div id="interestRoot"></div></section>
</div>
<div class="ov" id="ov"></div><aside class="dr" id="dr" aria-hidden="true"></aside>
<script>
let D=[],META={},tab='all',cur=null,dataLoadError='',prefsLoaded=false,prefsLoadError='',interestsBuilt=false,saving=false,deferredPrompt=null,interestTier='all',interestQuery='';
let serverPrefs={configured:false,nocs:[],storage_state:'missing',catalogue:{roles:[],courses:{},exclusions:[]},selection_meaning:'not_configured',updated_at:null};
let draft=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L={sent:'Sent',draft_saved:'Draft ready',no_email:'No email',skipped:'Skipped'};
const tc=s=>(s||'').replace(/(^|[\s(\/-])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase());
const today=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())})();
const pd=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');return m?new Date(+m[1],m[2]-1,+m[3]):null};
const days=s=>{const d=pd(s);return d?Math.round((d-today)/864e5):null};
const fd=s=>{const d=pd(s);return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}).replace(/(\d+) (\w+) (\d+)/,'$2 $1, $3'):''};
const fdt=iso=>{try{const d=new Date(iso);return d.toLocaleString('en-GB',{timeZone:'Europe/London',month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).replace(/(\d+) (\w+) (\d+),? /,'$2 $1, $3 ')+' (UK time)'}catch(e){return iso}};
const active=j=>j.status==='draft_saved'||j.status==='no_email';
const isSoon=j=>{const n=days(j.closing_date);return active(j)&&n!==null&&n>=0&&n<=7};
const yes=s=>/^yes/i.test(s||'');
const pay=j=>{const m=/\$([\d,.]+)/.exec(j.wage||'');if(!m)return 0;let v=parseFloat(m[1].replace(/,/g,''));return /year|annual/i.test(j.wage)?v/2080:v};
const typeOf=j=>{const t=(j.employment_type||'').split(',').map(s=>s.trim()).filter(Boolean);return t.length?t.reverse().join(' · '):''};
const sentDate=j=>(j.date_sent||'').slice(0,10)||((j.email&&j.email.source==='gmail sent message'&&j.email.gmail_date)?j.email.gmail_date.slice(0,10):'');
function batchTxt(b){const m=/^\s*(\d+)\s*\(([^)]+)\)/.exec(b||'');return m?`${m[2]} batch (#${m[1]})`:(b||'')}
function statusLong(j){
 if(j.status==='sent'){const e=j.email;const t=(e&&e.source==='gmail sent message'&&e.gmail_date)?fdt(e.gmail_date):(fd(j.date_sent)+((/\d\d:\d\d/.exec(j.date_sent||'')||[''])[0]?' '+/\d\d:\d\d/.exec(j.date_sent)[0]+(/London/.test(j.date_sent)?' (UK time)':''):''));return 'Sent on '+(t||'date not recorded')}
 if(j.status==='draft_saved')return j.send_batch?'Ready to send – scheduled '+batchTxt(j.send_batch):'Ready to send – not scheduled yet';
 if(j.status==='no_email')return 'No email – '+(j.no_email_how?j.no_email_how.replace(/^apply via link:.*$/i,'apply via Job Bank'):'apply via Job Bank / phone / in person');
 if(j.status==='skipped')return 'Skipped'+(j.skip_reason?' – '+j.skip_reason:'');
 return j.status}
function load(){
 const dataReq=fetch('/api/data',{credentials:'same-origin',cache:'no-store'});
 const prefReq=fetch('/api/preferences',{credentials:'same-origin',cache:'no-store'});
 dataReq.then(r=>{if(!r.ok)throw new Error('Could not load jobs ('+r.status+')');return r.json()}).then(d=>{D=d.jobs||[];META=d.meta||{};dataLoadError=''}).catch(e=>{D=[];META={};dataLoadError='Could not load data: '+(e.message||e)}).finally(()=>{
  prefReq.then(r=>{if(!r.ok)throw new Error('Could not load interests ('+r.status+')');return r.json()}).then(p=>{applyServerPrefs(p);prefsLoaded=true;prefsLoadError=''}).catch(e=>{prefsLoaded=false;prefsLoadError=e.message||'Could not load interests';applyServerPrefs({configured:false,nocs:[],storage_state:'missing',catalogue:{roles:[],courses:{},exclusions:[]},selection_meaning:'not_configured'})}).finally(init);
 })}
function init(){
 $('upd').textContent=META.generated?'Data updated '+fdt(META.generated):'';
 if(META.synthetic){$('fixtureBanner').hidden=false;$('fixtureBanner').textContent=(META.note||'Synthetic example data.')+' Interests saved in this preview stay in this preview only.'}
 const opts=(arr,el,lab)=>{[...new Set(arr.filter(Boolean))].sort().forEach(v=>el.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(lab?lab(v):v)}</option>`))};
 opts(D.map(j=>j.province),$('fProv'));
 const nocName={};
 ((serverPrefs.catalogue||{}).roles||[]).forEach(role=>{if(role&&role.noc)nocName[String(role.noc)]=role.official_title||role.display_title||''});
 D.forEach(j=>{if(j.noc&&!nocName[j.noc])nocName[j.noc]=(j.occupation||'').replace(/^\d+\s*/,'')});
 const nocs=[...new Set([...((serverPrefs.catalogue||{}).roles||[]).map(role=>role&&String(role.noc||'')),...D.map(j=>j.noc)].filter(Boolean))].sort();
 $('fNoc').innerHTML='<option value="">All NOC</option>'+nocs.map(v=>`<option value="${esc(v)}">${esc(v+(nocName[v]?' – '+nocName[v]:''))}</option>`).join('');
 const ds=[...new Set(D.map(j=>j.date_found).filter(Boolean))].sort().reverse();
 $('fDate').innerHTML='<option value="">All dates found</option>'+ds.map(d=>`<option value="${d}">Found ${fd(d)}</option>`).join('');
 ['q','fDate','fStatus','fProv','fNoc','fLmia','fSort'].forEach(id=>$(id).addEventListener('input',render));
 $('onlyInterests').addEventListener('change',render);

function filtered(){

function applyServerPrefs(p){

function setsEqual(a,b){if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true}
function savedSet(){return new Set(serverPrefs.configured?serverPrefs.nocs||[]:[])}

function canSave(){if(!prefsLoaded||saving)return false;if(!serverPrefs.configured)return true;return dirty()}

function courseKind(c){

 if(/not a certificate|training resource only|public documentation|none promised|no professional certification/.test(text)) return 'Training resource, not a promised certificate';

}

function fitOf(role){

 if(tier==='current CV fit') return {id:'current', label:'Current CV fit', note:'Recorded transferable experience is listed below. That is not proof every employer requirement is met, and it is not a qualification, a job, or a visa.'};
 if(tier==='portfolio or further training') return {id:'portfolio', label:'Portfolio or further training', note:'Preparation is still needed. These notes do not invent professional experience in this occupation.'};
 if(tier==='conditional') return {id:'conditional', label:'Conditional', note:'Use this only when the posting duties match skills that are actually documented. The gaps below are not filled in.'};

function visibleRoles(){

 interestsBuilt=true; paintRoles(); updateInterestStatus();

function renderInterests(){if(!interestsBuilt)buildInterestCards();else updateInterestStatus()}
async function saveInterests(){
 if(!canSave())return;
 saving=true; updateInterestStatus();
 const nocs=[...draft];
 try{
  const res=await fetch('/api/preferences',{method:'PUT',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','X-Tracker-Intent':'save-job-interests'},body:JSON.stringify({nocs})});
  const body=await res.json().catch(()=>({}));
  if(!res.ok||body.ok===false)throw new Error(body.message||('Save failed ('+res.status+')'));
  applyServerPrefs(body); prefsLoaded=true; prefsLoadError='';
  $('saveError').textContent='';
  paintTabs();
  interestsBuilt=false; renderInterests();
 }catch(e){
  const err=$('saveError'); if(err)err.textContent='Could not save. Your checks are still on this page and were not stored. '+(e.message||'');
 }finally{saving=false;updateInterestStatus()}
}
function isIos(){const ua=navigator.userAgent||'';return /iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function renderInstall(){
 const base=' Sign-in stays the browser’s username and password prompt. An icon is not a separate account, an APK, or an App Store app. Jobs, files, and interests are not stored for offline use.';
 if(isStandalone())$('installMsg').textContent='Opened from the installed icon.'+base;
 else if(isIos())$('installMsg').textContent='On iPhone or iPad, open this site in Safari, tap the Share button, then Add to Home Screen. Safari does not offer an automatic install button. The icon is a website shortcut, not an App Store app. iOS may ask for the tracker username and password again.'+base;
 else $('installMsg').textContent='This browser has not offered an install prompt. Use the site in this tab. There is no APK and no App Store download. If Chrome or Edge offers install, a button will show here.'+base;
}
function showInstallButton(){
 const slot=$('installAction'); if(!slot||slot.querySelector('button'))return;
 const btn=document.createElement('button'); btn.type='button'; btn.id='installBtn'; btn.textContent='Install app';
 btn.onclick=async()=>{
  if(!deferredPrompt)return; btn.disabled=true;
  try{
   deferredPrompt.prompt();
   const choice=await deferredPrompt.userChoice; deferredPrompt=null;
   if(choice&&choice.outcome==='accepted'){btn.remove();$('installMsg').textContent='Install started in the browser. Sign-in is still the browser prompt, and job data is not kept offline.'}
   else{btn.disabled=false;$('installMsg').textContent='Install was dismissed. You can use the browser menu if it still offers install. There is no separate APK or App Store app.'}
  }catch(e){btn.disabled=false;$('installMsg').textContent='This browser did not open an install prompt.'}
 };
 slot.appendChild(btn);
 $('installMsg').textContent='This browser offered an install prompt. The button uses that prompt. There is no APK or App Store download. Sign-in stays the browser’s username and password prompt.';
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallButton()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;const btn=$('installBtn');if(btn)btn.remove();$('installMsg').textContent='The browser accepted the install. Open the icon from your home screen or app list. Sign-in is still the browser prompt.'});
function setupServiceWorker(){if(!('serviceWorker' in navigator))return;navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}).catch(()=>{})}
$('logoutBtn').onclick=async()=>{
 D=[];
 try{
  if(navigator.serviceWorker){const reg=await navigator.serviceWorker.getRegistration();if(reg&&reg.active)reg.active.postMessage({type:'LOGOUT_CLEAR'})}
  if(window.caches){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}
 }catch(e){}
 location.assign('/logout');
};
renderInstall();setupServiceWorker();
load();
